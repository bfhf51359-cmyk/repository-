}

function toast(t) {
  const x = document.getElementById("toast");
  if (!x) return;
  x.textContent = t;
  x.style.display = "block";
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => x.style.display = "none", 2200);
}

function initials(n) {
  return (n || "?").split(/\s+/).map(x => x[0]).slice(0,2).join("").toUpperCase();
}

function escapeHtml(x) {
  return String(x ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function getLocalCurrent() {
  const id = localStorage.getItem(CURRENT_KEY);

function findLocalPeer(name) {
  const q = String(name).replace("@","").trim().toLowerCase();
  return accounts.find(a =>
    a.username.toLowerCase() === q || a.name.toLowerCase() === q
  ) || null;
}

async function findPeer(name) {
  const local = findLocalPeer(name);
  if (local) return local;

  const online = onlineUsers.get(normalizeUsername(name));
  if (online && online.id) {
    return {id:online.id,name:online.name||online.username,username:online.username,avatar:online.avatar||makeAvatar(online.name||online.username)};
  }

  if (!sb || !account) return null;
  const safe = String(name).replace(/,/g, "").trim();
  const { data, error } = await sb
    .from("profiles")
    .select("id,name,username")
    .or(`name.eq.${safe},username.eq.${safe.toLowerCase()}`)
    .limit(1);

  if (error) return null;
  return data?.[0] || null;
}

  const normalizedUser = user.replace(/^@/, "").toLowerCase();
  const found = accounts.find(a =>
    (a.name.toLowerCase() === normalizedUser ||
     String(a.username || "").toLowerCase() === normalizedUser) &&

  account = found;
  setUnread((account.notifications||[]).filter(n=>!n.read).length);
  saveAccounts();
  toast("Entrando...");
  setTimeout(() => enter(), 200);

function normalizeUsername(v){ return String(v||"").replace(/^@/,'').trim().toLowerCase(); }
function getUnread(){ return Number(localStorage.getItem('instagraved_unread_v1')||0); }
function setUnread(n){ unreadCount=Math.max(0,Number(n)||0); localStorage.setItem('instagraved_unread_v1',String(unreadCount)); }
function pushNotification(n){
  if(!account) return;
  if(!Array.isArray(account.notifications)) account.notifications=[];
  account.notifications.unshift({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),createdAt:new Date().toISOString(),...n});
  account.notifications=account.notifications.slice(0,100);
  updateAccount();
  setUnread(getUnread()+1);
}
function markNotificationsRead(){ setUnread(0); if(account){ account.notifications=(account.notifications||[]).map(n=>({...n,read:true})); updateAccount(); } }
function isFollowing(id){ return !!account && Array.isArray(account.followingIds) && account.followingIds.includes(id); }
function findAccount(id){ return accounts.find(a=>a.id===id) || null; }
function followLocal(id){
  if(!account || id===account.id) return;
  const target=findAccount(id); if(!target) return toast('Pessoa não encontrada.');
  if(!Array.isArray(account.followingIds)) account.followingIds=[];
  if(account.followingIds.includes(id)){
    account.followingIds=account.followingIds.filter(x=>x!==id);
    target.followersIds=(target.followersIds||[]).filter(x=>x!==account.id);
    account.following=account.followingIds.length; target.followers=target.followersIds.length || Number(target.followers||0);
    updateAccount(); saveAccounts();
    const ti=accounts.findIndex(a=>a.id===target.id); if(ti>=0) accounts[ti]=target; saveAccounts();
    toast('Você deixou de seguir @'+target.username);
    return false;
  }
  account.followingIds.push(id); target.followersIds=Array.isArray(target.followersIds)?target.followersIds:[];
  if(!target.followersIds.includes(account.id)) target.followersIds.push(account.id);
  account.following=account.followingIds.length; target.followers=target.followersIds.length;
  updateAccount(); const ti=accounts.findIndex(a=>a.id===target.id); if(ti>=0) accounts[ti]=target; saveAccounts();
  pushNotification({type:'system',text:'Você seguiu @'+target.username,fromId:target.id,fromName:target.name});
  if(target.id!==account.id){
    const wasFollowingBack=(target.followingIds||[]).includes(account.id);
    addFollowNoticeToTarget(target, wasFollowingBack ? 'follow_back' : 'follow');
  }
  toast('Seguindo @'+target.username);
  return true;
}
function addFollowNoticeToTarget(target, kind){
  if(!target) return;
  const back = kind==='follow_back';
  const text = back ? '@'+account.username+' te seguiu de volta' : '@'+account.username+' te seguiu';
  if(!Array.isArray(target.notifications)) target.notifications=[];
  target.notifications.unshift({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),type:kind,text,fromId:account.id,fromName:account.name,fromUsername:account.username,createdAt:new Date().toISOString(),read:false});
  target.notifications=target.notifications.slice(0,100);
  const idx=accounts.findIndex(a=>a.id===target.id); if(idx>=0) accounts[idx]=target;
  saveAccounts();
  setUnreadForAccount(target.id);
}
function setUnreadForAccount(id){
  // Local accounts share the device; the notification itself is persisted on the target account.
  if(id===account?.id) setUnread(getUnread()+1);
}
async function followUser(idOrUsername){
  const id=String(idOrUsername);
  const local=findAccount(id) || accounts.find(a=>normalizeUsername(a.username)===normalizeUsername(id));
  if(local) return followLocal(local.id);
  const u=onlineUsers.get(normalizeUsername(id));
  if(!u) return toast('Pessoa não encontrada ou offline.');
  const following=!!(account.remoteFollowing||[]).includes(normalizeUsername(u.username));
  account.remoteFollowing=Array.isArray(account.remoteFollowing)?account.remoteFollowing:[];
  if(following) account.remoteFollowing=account.remoteFollowing.filter(x=>x!==normalizeUsername(u.username));
  else account.remoteFollowing.push(normalizeUsername(u.username));
  saveAccounts();
  if(!following){
    const isBack=Array.isArray(account.remoteFollowers) && account.remoteFollowers.includes(normalizeUsername(u.username));
    await presenceChannel?.send({type:'broadcast',event:'follow-notification',payload:{to:normalizeUsername(u.username),fromId:account.id,fromName:account.name,fromUsername:normalizeUsername(account.username),kind:isBack?'follow_back':'follow',text:isBack?'@'+normalizeUsername(account.username)+' te seguiu de volta':'@'+normalizeUsername(account.username)+' te seguiu'}});
    toast(isBack?'Seguindo de volta @'+u.username:'Seguindo @'+u.username);
  } else toast('Você deixou de seguir @'+u.username);
  return !following;
}
function receiveOnlineMessage(payload){
  if(!payload||!account)return;
  const me=normalizeUsername(account.username); if(normalizeUsername(payload.to)!==me)return;
  const from=normalizeUsername(payload.from);
  const msg={id:payload.id||('online_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),sender_id:'online:'+from,receiver_id:'online:'+me,text:String(payload.text||''),created_at:payload.created_at||new Date().toISOString()};
  if(payload.kind==='media'){msg.media_type=payload.media_type;msg.mediaData=payload.mediaData;msg.media_name=payload.media_name||'';}
  if(localMessages.some(m=>m.id===msg.id))return;
  localMessages.push(msg);saveMessages();
  const activePeer='online:'+from;
  if(document.getElementById('chatList')&&activePeerId===activePeer)appendMessage(msg);
  else {
    const label=payload.media_type==='image'?'📷 enviou uma foto':payload.media_type==='video'?'🎥 enviou um vídeo':payload.media_type==='audio'?'🎙️ enviou um áudio':'enviou uma mensagem: '+String(payload.text||'').slice(0,80);
    pushNotification({type:'message',text:'@'+from+' '+label,fromId:payload.fromId,fromName:payload.fromName||payload.from||from,fromUsername:from,messageId:msg.id});
    toast('💬 Nova mensagem de @'+from);
  }
}

}

function search() {
  const all = accounts.map(a => ({id:a.id,name:a.name,username:a.username,avatar:a.avatar,local:true}));
  onlineUsers.forEach(u => { if(!all.some(x=>normalizeUsername(x.username)===normalizeUsername(u.username))) all.push({id:'online:'+normalizeUsername(u.username),name:u.name,username:u.username,avatar:u.avatar,online:true}); });
  const seen = new Set();
  const people = all.filter(u => {

    seen.add(key); return true;

  return `<div class="content">

      <button class="primary" onclick="go('profile')">🖼️ Trocar foto de perfil</button>

  </div>`;

let cameraMode = 'post';
let cameraStream = null;
let cameraFacing = 'user';
let cameraSwipeX = 0;
let cameraRecorder = null;
let cameraChunks = [];

function modeIndex(){ return ['post','story','reel','live'].indexOf(cameraMode); }
function modeLabel(){ return {post:'POST',story:'STORY',reel:'REEL',live:'LIVE'}[cameraMode]; }
function setCameraMode(m){
  cameraMode=m;
  const root=document.getElementById('cameraPage');
  if(!root) return;
  root.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  const cap=document.getElementById('cameraCapture');
  if(cap) cap.classList.toggle('live',m==='live');
  const hint=document.getElementById('cameraHint');
  if(hint) hint.textContent = m==='live' ? 'Toque no botão para iniciar/encerrar sua Live' : m==='story' ? 'Tire uma foto para publicar no Story' : m==='reel' ? 'Grave um vídeo curto' : 'Tire uma foto para publicar';
  if(m==='live') startLiveCameraPreview();
  if(m!=='live'){ const label=document.getElementById('liveCameraLabel'); if(label) label.style.display='none'; const counter=document.getElementById('liveCameraCounter'); if(counter) counter.style.display='none'; }
}

async function openCamera(initial='post'){
  cameraMode=initial;
  const d=document.createElement('div');
  d.id='cameraPage'; d.className='camera-page';
  d.innerHTML=`
    <div class="camera-preview" id="cameraPreview">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="camera-fallback" id="cameraFallback">📷</div>
      <div class="camera-top"><button class="camera-close" onclick="closeCamera()">×</button><button class="camera-tool" onclick="toggleCameraFlash()">⚙</button></div>
      <div class="camera-side">
        <button onclick="cameraText()">Aa &nbsp; Criar</button>
        <button onclick="cameraBoomerang()">∞ &nbsp; Boomerang</button>
        <button onclick="cameraEffects()">✺ &nbsp; Efeitos</button>
      </div>
      <div class="camera-audience" id="cameraAudience" style="display:none">👥 Todos⌄</div>
      <div class="live-camera-label" id="liveCameraLabel" style="display:none"><span class="live-status-dot"></span><span class="live-red">AO VIVO</span></div>
      <div class="live-camera-counter" id="liveCameraCounter" style="display:none">👥 0</div>
    </div>
    <div class="camera-controls">
      <div class="mode-row">
        <button class="mode" data-mode="post" onclick="setCameraMode('post')">POST</button>
        <button class="mode" data-mode="story" onclick="setCameraMode('story')">STORY</button>
        <button class="mode" data-mode="reel" onclick="setCameraMode('reel')">REEL</button>
        <button class="mode" data-mode="live" onclick="setCameraMode('live')">LIVE</button>
      </div>
      <div class="capture-row">
        <img id="cameraGallery" class="gallery-thumb" src="${account.avatar || makeAvatar(account.name)}" alt="">
        <button id="cameraCapture" class="capture" onclick="cameraCapture()"></button>
        <button class="flip" onclick="flipCamera()">↻</button>
      </div>
      <div class="camera-hint" id="cameraHint">Tire uma foto para publicar</div>
    </div>`;
  document.body.appendChild(d);
  setCameraMode(initial);
  const preview=document.getElementById('cameraPreview');
  preview.addEventListener('touchstart',e=>{cameraSwipeX=e.changedTouches[0].clientX},{passive:true});
  preview.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-cameraSwipeX;
    if(Math.abs(dx)>55){ const modes=['post','story','reel','live']; let i=modeIndex()+(dx<0?1:-1); if(i<0)i=3;if(i>3)i=0;setCameraMode(modes[i]); }
  },{passive:true});
  await startCameraStream();
}

async function startCameraStream(){
  try{
    if(cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing},audio:true});
    const v=document.getElementById('cameraVideo');
    if(v){v.srcObject=cameraStream; document.getElementById('cameraFallback').style.display='none';}
  }catch(e){
    document.getElementById('cameraFallback').style.display='grid';
    toast('Permita o acesso à câmera para usar esta função.');
  }
}
async function flipCamera(){cameraFacing=cameraFacing==='user'?'environment':'user';await startCameraStream();}
function toggleCameraFlash(){toast('Controles da câmera abertos');}
function cameraText(){toast('Modo Criar');}
function cameraBoomerang(){toast('Boomerang selecionado');}
function cameraEffects(){toast('Efeitos selecionados');}
async function startLiveCameraPreview(){
  const aud=document.getElementById('cameraAudience'); if(aud) aud.style.display='block';
  const label=document.getElementById('liveCameraLabel'); if(label) label.style.display='flex';
  const counter=document.getElementById('liveCameraCounter'); if(counter){counter.style.display='block';counter.textContent='👥 '+Number(account.liveViewers||0);}
}
function cameraCapture(){
  if(cameraMode==='live') return toggleLiveFromCamera();
  const v=document.getElementById('cameraVideo');
  if(!v || !cameraStream) return toast('Câmera não disponível.');
  if(cameraMode==='reel') return recordReel();
  const canvas=document.createElement('canvas'); canvas.width=v.videoWidth||720; canvas.height=v.videoHeight||1280;
  canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
  const media=canvas.toDataURL('image/jpeg',.88);
  if(cameraMode==='story'){
    account.story={media,type:'image',createdAt:Date.now(),expiresAt:Date.now()+24*60*60*1000};
    updateAccount(); toast('Story publicado!'); closeCamera(); go('home');
  }else{
    account.posts=account.posts||[]; account.posts.push({id:'p_'+Date.now(),text:'',media,type:'image',createdAt:new Date().toISOString()});
    updateAccount(); toast('Foto publicada!'); closeCamera(); go('home');
  }
}
function recordReel(){
  if(!cameraStream) return toast('Câmera não disponível.');
  if(cameraRecorder && cameraRecorder.state==='recording'){cameraRecorder.stop();return;}
  cameraChunks=[];
  cameraRecorder=new MediaRecorder(cameraStream,{mimeType:'video/webm'});
  cameraRecorder.ondataavailable=e=>{if(e.data.size)cameraChunks.push(e.data)};
  cameraRecorder.onstop=()=>{const blob=new Blob(cameraChunks,{type:'video/webm'}); const r=new FileReader(); r.onload=()=>{account.posts=account.posts||[];account.posts.push({id:'p_'+Date.now(),text:'Meu Reel',media:r.result,type:'video',createdAt:new Date().toISOString()});updateAccount();toast('Reel publicado!');closeCamera();go('home')};r.readAsDataURL(blob)};
  cameraRecorder.start(); toast('🔴 Gravando Reel... toque novamente para parar');
}
function toggleLiveFromCamera(){
  if(account.live){
    account.live=false;
    account.liveStartedAt=0;
    account.liveViewers=0;
    updateAccount();
    toast('🔴 Live encerrada.');
    closeCamera();
    go('home');
    return;
  }
  account.live=true;
  account.liveStartedAt=Date.now();
  account.liveViewers=0;
  account.liveViewerIds=[];
  updateAccount();
  toast('🔴 Você está AO VIVO!');
  const h=document.getElementById('cameraHint'); if(h)h.textContent='🔴 AO VIVO — toque para encerrar';
  const label=document.getElementById('liveCameraLabel'); if(label) label.style.display='flex';
  const counter=document.getElementById('liveCameraCounter'); if(counter){counter.style.display='block';counter.textContent='👥 0';}
}
function closeCamera(){
  if(cameraRecorder && cameraRecorder.state==='recording') cameraRecorder.stop();
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
  document.getElementById('cameraPage')?.remove();
}

function readImageFile(file) {
  return new Promise((resolve,reject)=>{
    if (!file) return resolve("");
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function previewPost(input) {
  const file = input.files?.[0];
  if (!file) return;
  const img = document.getElementById("postPreview");
  img.src = URL.createObjectURL(file);
  img.style.display = "block";
}

async function createMediaPost() {
  const text = document.getElementById("postText")?.value.trim() || "";
  const imageFile = document.getElementById("postImageFile")?.files?.[0];
  const videoFile = document.getElementById("postVideoFile")?.files?.[0];

  if (!imageFile && !videoFile && !text) {
    return toast("Escolha uma foto, vídeo ou escreva uma legenda.");
  }
  if (imageFile && videoFile) {
    return toast("Escolha foto OU vídeo para o mesmo post.");
  }

  const file = imageFile || videoFile;
  const media = await readImageFile(file);
  const type = videoFile ? "video" : "image";

  account.posts = account.posts || [];
  account.posts.push({
    id:"p_"+Date.now(),
    text,
    media,
    type,
    createdAt:new Date().toISOString()
  });

  updateAccount();
  toast("Publicado!");
  go("home");
}

async function createMediaStory() {
  const imageFile = document.getElementById("storyImageFile")?.files?.[0];
  const videoFile = document.getElementById("storyVideoFile")?.files?.[0];

  if (!imageFile && !videoFile) {
    return toast("Escolha uma foto ou vídeo para o Story.");
  }
  if (imageFile && videoFile) {
    return toast("Escolha foto OU vídeo para o Story.");
  }

  const file = imageFile || videoFile;
  const media = await readImageFile(file);

  account.story = {
    media,
    type: videoFile ? "video" : "image",
    createdAt: Date.now(),
    expiresAt: Date.now() + 24*60*60*1000
  };

  updateAccount();
  toast("Story publicado!");
  go("home");
}


function startLive(){ openCamera('live'); }
function stopLive(){
  account.live=false; account.liveStartedAt=0; account.liveViewers=0; account.liveViewerIds=[]; updateAccount(); toast("🔴 Live encerrada."); go("home");
}
function liveViewerAvatars(a){
  const ids=Array.isArray(a.liveViewerIds)?a.liveViewerIds:[];
  return ids.map(id=>accounts.find(x=>x.id===id)).filter(Boolean).slice(0,5);
}

function refreshLiveCounter(hostId){
  const a=accounts.find(x=>x.id===hostId);
  if(!a) return;
  const count=Number(a.liveViewers||0);
  const els=[document.getElementById('watchLiveCount'),document.getElementById('watchLiveCount2'),document.getElementById('liveCameraCounter')].filter(Boolean);
  els.forEach(el=>el.textContent='👥 '+count);
  const stack=document.getElementById('watchLiveAvatars');
  if(stack){
    const avs=liveViewerAvatars(a);
    stack.innerHTML=avs.map(v=>`<img src="${v.avatar || makeAvatar(v.name)}" title="${escapeHtml(v.name)}">`).join('');
  }
}

function watchLive(id){
  const a=accounts.find(x=>x.id===id);
  if(!a || !a.live) return toast('Essa Live já terminou.');
  if(!Array.isArray(a.liveViewerIds)) a.liveViewerIds=[];
  // A mesma conta só conta uma vez enquanto estiver assistindo.

  const d=document.createElement('div');

  d.style.cssText='position:fixed;inset:0;background:#080808;color:#fff;z-index:300;padding:18px;overflow:auto';
  d.innerHTML=`
    <div style="max-width:620px;margin:25px auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px">
        <div class="live-badge"><span class="live-status-dot"></span> AO VIVO</div>
        <div class="live-viewer-count" id="watchLiveCount">👥 ${a.liveViewers}</div>
      </div>

        <div class="row">
          <img class="account-avatar" src="${a.avatar || makeAvatar(a.name)}">

          <button style="background:#fff2;color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:25px" onclick="leaveLiveViewer('${a.id}')">×</button>
        </div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:8px"><b>👥 Pessoas na Live</b><span id="watchLiveAvatars" class="live-avatar-stack"></span></div>

  document.body.appendChild(d);

function leaveLiveViewer(id){
  const a=accounts.find(x=>x.id===id);
  if(a){
    if(!Array.isArray(a.liveViewerIds)) a.liveViewerIds=[];
    a.liveViewerIds=a.liveViewerIds.filter(x=>x!==account?.id);
    a.liveViewers=a.liveViewerIds.length;
    saveAccounts();
  }
  document.getElementById('liveViewerPage')?.remove();
  toast('Você saiu da Live.');
}

function storyMine() {
  if (account.story && account.story.expiresAt > Date.now()) {
    viewStory(account.id);
  } else {
    toast("Você ainda não publicou um Story.");
    go("create");

function viewStory(id) {

function updateAccount() {
  const i = accounts.findIndex(a=>a.id===account.id);
  if (i >= 0) accounts[i] = account;
  saveAccounts();
}

function viewProfile(id) {
  let a = findAccount(id);
  let online = false;
  if(!a && String(id).startsWith('online:')){ const u=onlineUsers.get(normalizeUsername(String(id).slice(7))); if(u) a={id:String(id),name:u.name,username:u.username,avatar:u.avatar,bio:'Online no Instagraved.',posts:[]}, online=true; }
  if(!a) return toast('Perfil não encontrado.');
  const mine=a.id===account.id;
  const following=online ? !!(account.remoteFollowing||[]).includes(normalizeUsername(a.username)) : isFollowing(a.id);

async function subscribeOnlinePresence() {
  if (!sb || !account) return;
  if (presenceChannel) { try { await sb.removeChannel(presenceChannel); } catch {} }
  onlineUsers = new Map(); presenceReady=false;
  presenceChannel = sb.channel("instagraved-online", { config: { presence: { key: normalizeUsername(account.username) } } });
  const refreshOnline = () => {
    const state = presenceChannel.presenceState(); const map = new Map();
    Object.values(state).flat().forEach(u => { if(!u||!u.username)return; const key=normalizeUsername(u.username); if(key===normalizeUsername(account.username))return; map.set(key,u); });
    onlineUsers=map; if(current==="messages"&&document.getElementById("onlinePeople")) renderOnlinePeople();
  };
  presenceChannel
    .on("presence",{event:"sync"},refreshOnline)
    .on("presence",{event:"join"},refreshOnline)
    .on("presence",{event:"leave"},refreshOnline)
    .on("broadcast",{event:"chat-message"},({payload})=>receiveOnlineMessage(payload))
    .on("broadcast",{event:"incoming-call"},({payload})=>{ if(!payload)return; if(normalizeUsername(payload.to)!==normalizeUsername(account.username))return; pendingCall=payload; showIncomingCall(payload); })
    .on("broadcast",{event:"follow-notification"},({payload})=>{
      if(!payload || normalizeUsername(payload.to)!==normalizeUsername(account.username)) return;
      account.remoteFollowers=Array.isArray(account.remoteFollowers)?account.remoteFollowers:[];
      const follower=normalizeUsername(payload.fromUsername);
      if(follower && !account.remoteFollowers.includes(follower)) account.remoteFollowers.push(follower);
      pushNotification({type:payload.kind==='follow_back'?'follow_back':'follow',text:payload.text||('@'+payload.fromUsername+' te seguiu'),fromId:payload.fromId,fromName:payload.fromName,fromUsername:payload.fromUsername});
      toast('🔔 '+(payload.text||'Você recebeu uma nova interação.'));
    });
  await presenceChannel.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      presenceReady=true;
      await presenceChannel.track({id:account.id,username:normalizeUsername(account.username),name:account.name,avatar:account.avatar||makeAvatar(account.name),online_at:new Date().toISOString()});
    }
  });
}

function mediaBubble(m, outgoing){
  const align=outgoing?'right':'left';
  const src=m.media_url||m.mediaData||'';
  let body='';
  if(m.media_type==='image') body=`<img src="${src}" style="max-width:220px;max-height:280px;border-radius:14px;display:block" alt="Foto">`;
  else if(m.media_type==='video') body=`<video src="${src}" controls playsinline style="max-width:240px;max-height:300px;border-radius:14px;display:block"></video>`;
  else if(m.media_type==='audio') body=`<audio src="${src}" controls style="max-width:250px"></audio>`;
  return `<div style="text-align:${align};margin:10px 0">${body}<div class="muted" style="font-size:11px;margin-top:3px">${outgoing?'Você':'Mensagem de mídia'}</div></div>`;
}
function renderOnlineConversation(username){
  const me='online:'+normalizeUsername(account.username), peer='online:'+normalizeUsername(username);
  const list=document.getElementById('chatList'); if(!list)return;
  const msgs=localMessages.filter(m=>(m.sender_id===me&&m.receiver_id===peer)||(m.sender_id===peer&&m.receiver_id===me)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  list.innerHTML=msgs.length?msgs.map(m=>m.media_type?mediaBubble(m,m.sender_id===me):`<div style="text-align:${m.sender_id===me?'right':'left'};margin:10px 0"><span class="pill">${escapeHtml(m.text)}</span></div>`).join(''):`<div class="muted">Nenhuma mensagem ainda.</div>`;
  list.scrollTop=list.scrollHeight;
}
async function subscribeOnlineChat(username){
  if(!sb||!account)return;
  if(messageChannel){try{await sb.removeChannel(messageChannel);}catch{}}
  const peer=normalizeUsername(username), me=normalizeUsername(account.username), room=[me,peer].sort().join(':');

  messageChannel.on('broadcast',{event:'chat-message'},({payload})=>receiveOnlineMessage(payload));

async function sendOnlineMessage(username){
  const el=document.getElementById('msgInput'), text=el?.value.trim();
  if(!text)return;
  if(!sb)return toast('Ative a conexão online do Instagraved para enviar mensagens entre aparelhos.');
  const to=normalizeUsername(username), from=normalizeUsername(account.username);
  const channel=presenceChannel;
  if(!channel || !presenceReady){toast('Conectando... tente novamente em 1 segundo.');return;}
  const msg={id:'online_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),from,to,text,fromId:account.id,fromName:account.name,created_at:new Date().toISOString(),kind:'text'};
  const local={id:msg.id,sender_id:'online:'+from,receiver_id:'online:'+to,text,created_at:msg.created_at};
  const result=await channel.send({type:'broadcast',event:'chat-message',payload:msg});
  if(result?.error){toast('Não foi possível entregar agora.');return;}
  localMessages.push(local);saveMessages();appendMessage(local);el.value='';
}
async function sendOnlineMedia(username,input,mediaType){
  const file=input?.files?.[0]; if(!file)return;
  input.value='';
  if(!sb||!presenceChannel||!presenceReady)return toast('Conectando ao Instagraved... tente novamente.');
  // Broadcast é ótimo para mensagens pequenas. Para manter este protótipo leve,
  // comprime fotos e limita mídia enviada diretamente pelo canal.
  if(file.size>250*1024) return toast('Esse arquivo é grande demais para envio direto. Escolha um arquivo menor (até 250 KB).');
  const reader=new FileReader();
  reader.onload=async()=>{
    const from=normalizeUsername(account.username),to=normalizeUsername(username);
    const msg={id:'media_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),from,to,fromId:account.id,fromName:account.name,created_at:new Date().toISOString(),kind:'media',media_type:mediaType,media_name:file.name,mediaData:String(reader.result)};
    const result=await presenceChannel.send({type:'broadcast',event:'chat-message',payload:msg});
    if(result?.error)return toast('Não foi possível enviar essa mídia.');
    const local={id:msg.id,sender_id:'online:'+from,receiver_id:'online:'+to,text:'',media_type:mediaType,mediaData:msg.mediaData,media_name:file.name,created_at:msg.created_at};
    localMessages.push(local);saveMessages();appendMessage(local);toast(mediaType==='image'?'📷 Foto enviada':mediaType==='video'?'🎥 Vídeo enviado':'🎙️ Áudio enviado');
  };
  reader.readAsDataURL(file);
}
async function toggleAudioRecording(username){
  const btn=document.getElementById('audioRecordBtn');
  if(recordingAudio){
    recordingAudio=false; mediaRecorder?.stop(); if(btn)btn.textContent='🎙️ Áudio'; return;
  }
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Este navegador não permite gravar áudio.');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaChunks=[]; mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'}); recordingAudio=true;
    if(btn)btn.textContent='⏹️ Parar áudio';
    mediaRecorder.ondataavailable=e=>{if(e.data.size)mediaChunks.push(e.data)};
    mediaRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(mediaChunks,{type:'audio/webm'});
      if(blob.size>250*1024)return toast('O áudio ficou grande. Grave um trecho mais curto.');
      const reader=new FileReader(); reader.onload=async()=>{
        if(!presenceChannel||!presenceReady)return toast('Conexão perdida.');
        const from=normalizeUsername(account.username),to=normalizeUsername(username),now=new Date().toISOString();
        const msg={id:'audio_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),from,to,fromId:account.id,fromName:account.name,created_at:now,kind:'media',media_type:'audio',media_name:'audio.webm',mediaData:String(reader.result)};
        const result=await presenceChannel.send({type:'broadcast',event:'chat-message',payload:msg});
        if(result?.error)return toast('Não foi possível enviar o áudio.');
        const local={id:msg.id,sender_id:'online:'+from,receiver_id:'online:'+to,text:'',media_type:'audio',mediaData:msg.mediaData,created_at:now};
        localMessages.push(local);saveMessages();appendMessage(local);toast('🎙️ Áudio enviado');
      }; reader.readAsDataURL(blob);
    };
    mediaRecorder.start(); toast('🎙️ Gravando... toque novamente para parar.');
  }catch(e){recordingAudio=false;if(btn)btn.textContent='🎙️ Áudio';toast('Permita o acesso ao microfone para gravar áudio.');}
}

  ).sort((x,y) => new Date(x.created_at)-new Date(y.created_at));
}

async function subscribeMessages(peerId) {
  if (!sb || !account) return;
  if (messageChannel) {
    try { await sb.removeChannel(messageChannel); } catch {}
  }
  messageChannel = sb.channel("messages:" + [account.id,peerId].sort().join(":"));
  messageChannel.on("broadcast",{event:"new-message"},({payload})=>{
    if (payload.receiver_id===account.id && payload.sender_id===peerId) {
      appendMessage(payload);
    }
  });
  await messageChannel.subscribe();
}

function appendMessage(m) {
  const list=document.getElementById('chatList'); if(!list)return;
  const empty=list.querySelector('.muted'); if(empty)empty.remove();
  list.innerHTML += m.media_type ? mediaBubble(m,m.sender_id===account.id||m.sender_id==='online:'+normalizeUsername(account.username)) : `<div style="text-align:${m.sender_id===account.id||m.sender_id==='online:'+normalizeUsername(account.username)?'right':'left'};margin:10px 0"><span class="pill">${escapeHtml(m.text)}</span></div>`;
  list.scrollTop=list.scrollHeight;
}

async function sendMessage(peerId) {
  const el = document.getElementById("msgInput");
  const text = el?.value.trim();
  if (!text) return;

  // Sempre salva localmente primeiro, para o botão funcionar sem Supabase.
  const local = {
    id: "msg_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
    sender_id: account.id,
    receiver_id: peerId,
    text,
    created_at: new Date().toISOString()
  };
  localMessages.push(local);
  saveMessages();
  appendMessage(local);
  el.value = "";

  // Perfis de demonstração com IA respondem automaticamente para o protótipo.
  const demo = accounts.find(a => a.id === peerId && String(a.id).startsWith("local_demo_"));
  if (demo) {
    setTimeout(() => {
      const replies = ["Oi! 😊 Que bom falar com você!", "Estou aqui no Instagraved!", "Legal! Me conta mais.", "Vi sua mensagem. 😄", "Tudo certo por aqui! Vamos conversar."];
      const reply = {id:"ai_"+Date.now(), sender_id:demo.id, receiver_id:account.id, text:replies[Math.floor(Math.random()*replies.length)], created_at:new Date().toISOString()};
      localMessages.push(reply); saveMessages(); appendMessage(reply);
    }, 900);
  }

  // Se o destinatário for uma conta Supabase e o backend estiver configurado,
  // tenta também gravar online. Se falhar, a mensagem local continua funcionando.
  if (sb && !String(peerId).startsWith("local_")) {
    try {
      const { data, error } = await sb.from("messages")
        .insert({sender_id:account.id, receiver_id:peerId, text})
        .select().single();
      if (!error && data && messageChannel) {
        await messageChannel.send({type:"broadcast",event:"new-message",payload:data});
      }
    } catch {}
  }
}

          <button class="pill" onclick="startCall('${escapeHtml(u.username)}','voz')">☎</button>
          <button class="pill" onclick="startCall('${escapeHtml(u.username)}','vídeo')">▣</button>
        </div>`).join("")
      : `<div class="panel">Crie outra conta para testar.</div>`}
  </div>`;
}

function profile() {
  return `<div class="content">
    <div class="panel">
      <div class="profileHead">
        <img class="profileAvatar" src="${account.avatar || makeAvatar(account.name)}" alt="">
        <div class="grow">
          <h2 style="margin:0">${escapeHtml(account.name)}</h2>
          <div class="muted">@${escapeHtml(account.username)}</div>
          <div class="stats">
            <div class="stat"><b>${account.posts?.length||0}</b><span class="muted">posts</span></div>
            <div class="stat"><b>${account.followers||0}</b><span class="muted">seguidores</span></div>
            <div class="stat"><b>${account.following||0}</b><span class="muted">seguindo</span></div>
          </div>
        </div>
      </div>
      <button class="primary" onclick="editProfile()">Editar perfil</button>
    </div>
    <button class="primary" onclick="go('settings')">Configurações</button>
  </div>`;
}

function settings() {
  return `<div class="content"><h2>Configurações</h2>
    <div class="panel"><b>Conexão</b>
      <div class="muted" style="margin-top:6px">
        ${onlineReady ? "🟢 Supabase configurado" : "🟠 Modo local — funciona sem Supabase"}
      </div>
    </div>

      <div class="row"><div class="grow"><b>Modo escuro</b></div>
        <button class="pill" onclick="document.body.classList.toggle('dark')">Alternar</button>
      </div>

    <button class="primary" onclick="showHelp()">Central de ajuda</button>
    <button class="primary" onclick="logout()">Sair da conta</button>

function notifications() {
  markNotificationsRead();
  const ns=Array.isArray(account.notifications)?account.notifications:[];
  return `<div class="content"><h2>Notificações</h2>${ns.length?ns.map(n=>{
    const fromUsername=normalizeUsername(n.fromUsername);
    const fromAccount=findAccount(n.fromId);
    const online=onlineUsers.get(fromUsername);
    const avatar=fromAccount?.avatar || online?.avatar || makeAvatar(n.fromName||fromUsername||'Instagraved');
    const canOpen=!!fromUsername && (n.type==='message' || n.type==='follow' || n.type==='follow_back');
    const action=canOpen ? `onclick="openNotification('${escapeHtml(fromUsername)}','${escapeHtml(n.type||'')}')"` : '';
    const button=n.type==='message' ? `<button class="pill" onclick="event.stopPropagation();openNotification('${escapeHtml(fromUsername)}','message')">Ver mensagem</button>` : '';
    return `<div class="panel row notif-click" ${action} style="cursor:${canOpen?'pointer':'default'}"><img class="account-avatar" src="${avatar}" alt=""><div class="grow"><b>${escapeHtml(n.fromName||('@'+fromUsername)||'Instagraved')}</b><div class="notif-text">${escapeHtml(n.text||'Nova atividade')}</div>${n.type==='message'?'<div class="muted" style="margin-top:5px">Toque para abrir e responder</div>':''}</div>${button}</div>`;
  }).join(''):`<div class="panel muted">Nenhuma notificação nova.</div>`}</div>`;
}
function openNotification(username,type){
  if(!username) return;
  if(type==='message'){
    const online=onlineUsers.get(normalizeUsername(username));
    return online ? chatOnline(username) : chatByName(username);
  }
  if(type==='follow' || type==='follow_back'){
    const local=findLocalPeer(username);
    if(local) return viewProfile(local.id);
    return toast('@'+username+' interagiu com você.');
  }
}

function report(n) {
  toast("Opções: bloquear ou denunciar @" + n.toLowerCase());
}

// ================= CHAMADAS ONLINE =================
// O sistema local não finge que a chamada está conectada.
// Para chamada entre aparelhos, o Supabase precisa estar configurado.

async function subscribeUserChannel() {
  if (!sb || !account) return;
  if (userChannel) { try { await sb.removeChannel(userChannel); } catch {} }

  userChannel = sb.channel("user:" + account.id);
  userChannel.on("broadcast",{event:"incoming-call"},({payload})=>{
    pendingCall = payload;
    showIncomingCall(payload);
  });
  await userChannel.subscribe();
}

function showIncomingCall(payload) {
  const existing = document.getElementById("incomingCall");
  if (existing) existing.remove();

  const d = document.createElement("div");
  d.id = "incomingCall";
  d.style.cssText = "position:fixed;inset:0;background:#0008;z-index:100;display:grid;place-items:center;padding:20px";
  d.innerHTML = `<div class="panel" style="width:min(420px,100%);text-align:center">
    <h2>📞 Chamada recebida</h2>
    <p>${escapeHtml(payload.fromName||"Alguém")} está ligando por ${payload.type==="video"?"vídeo":"voz"}.</p>
    <button class="primary" onclick="acceptCall()">Atender</button>
    <button class="link" onclick="rejectCall()">Recusar</button>
  </div>`;
  document.body.appendChild(d);
}

async function rejectCall() {
  pendingCall = null;
  document.getElementById("incomingCall")?.remove();
  toast("Chamada recusada.");
}

async function acceptCall() {
  const p = pendingCall;
  pendingCall = null;
  document.getElementById("incomingCall")?.remove();
  if (!p || !sb) return toast("Backend de chamadas não está conectado.");
  try {
    await openCall(p.fromId,p.fromName,p.type,p.channel,false);
  } catch (e) {
    console.error(e);
    toast("Não foi possível atender a ligação. Verifique câmera e microfone.");
  }
}

async function startCall(name,type) {
  if (!sb || !account) {
    return toast("A chamada entre aparelhos precisa do Supabase configurado.");
  }

  const peer = await findPeer(name);
  if (!peer) return toast("Esse amigo não está disponível para ligação agora. Verifique se ele está online.");

  const channelName = "call:" + [account.id,peer.id].sort().join(":");

  // O aviso e a negociação são separados; o receptor não precisa receber
  // um offer nulo antes de aceitar.
  // O convite usa o canal global de presença, que o amigo já mantém aberto.
  // Assim o convite não se perde por falta de uma assinatura prévia no canal user:ID.
  const callInvite = {
    fromId:account.id,
    fromName:account.name,
    fromUsername:String(account.username).toLowerCase(),
    toId:peer.id,
    to:String(peer.username || "").toLowerCase(),
    type:type==="vídeo"?"video":"voice",
    channel:channelName
  };
  if (presenceChannel) {
    await presenceChannel.send({type:"broadcast",event:"incoming-call",payload:callInvite});
  } else {
    const ch = sb.channel("instagraved-online");
    await ch.subscribe();
    await ch.send({type:"broadcast",event:"incoming-call",payload:callInvite});
    try { await sb.removeChannel(ch); } catch {}
  }

  await openCall(peer.id,peer.name,type==="vídeo"?"video":"voice",channelName,true);
}

async function openCall(peerId,peerName,type,channelName,isCaller) {
  openingCall = true;
  await endCall(false);
  activePeerId = peerId;

  if (!navigator.mediaDevices?.getUserMedia) {
    return toast("O navegador não liberou câmera/microfone.");
  }

  callChannel = sb.channel(channelName);
  let remoteDescriptionSet = false;
  const pendingIceCandidates = [];

  pc = new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });

  pc.onicecandidate = e => {
    if (e.candidate && callChannel) {
      callChannel.send({
        type:"broadcast",
        event:"ice",
        payload:{from:account.id,candidate:e.candidate}
      });
    }
  };

  pc.onconnectionstatechange = () => {
    const status = document.getElementById("callStatus");
    if (!status) return;
    const st = pc.connectionState;
    status.textContent = st === "connected" ? "Conectado" : st === "connecting" ? "Conectando ligação..." : st === "disconnected" ? "Conexão interrompida" : st === "failed" ? "Não foi possível conectar" : "Ligação de voz";
  };

  pc.ontrack = e => {
    const stream = e.streams[0];
    const v = document.getElementById("remoteVideo");
    const a = document.getElementById("remoteAudio");
    if (v) v.srcObject = stream;
    if (a) {
      a.srcObject = stream;
      a.play().catch(()=>{});
    }
  };

  try {
    // Voz pede somente microfone; vídeo pede câmera + microfone.
    localStream = await navigator.mediaDevices.getUserMedia({
      video:type==="video",
      audio:true
    });
  } catch (err) {
    console.warn('getUserMedia:',err);
    openingCall=false;
    if(pc){try{pc.close();}catch{}}
    pc=null;
    if(callChannel&&sb){try{await sb.removeChannel(callChannel);}catch{}}
    callChannel=null;
    document.getElementById('app').innerHTML=`<div class="call-screen ${type==='video'?'video':'voice'}"><div class="panel" style="width:min(430px,92%);text-align:center;margin:auto"><div style="font-size:52px">${type==='video'?'📹':'🎙️'}</div><h2>Permissão necessária</h2><p class="muted">Para ${type==='video'?'fazer a chamada de vídeo, permita a câmera e o microfone.':'fazer a ligação, permita o microfone.'}</p><button class="primary" onclick="openCall('${escapeHtml(peerId)}','${escapeHtml(peerName)}','${escapeHtml(type)}','${escapeHtml(channelName)}',${isCaller})">Tentar novamente</button><button class="link" onclick="go('messages')">Voltar para mensagens</button></div></div>`;
    return;
  }

  localStream.getTracks().forEach(t => pc.addTrack(t,localStream));

  callChannel.on("broadcast",{event:"offer"},async({payload})=>{
    if (payload.to!==account.id) return;
    await pc.setRemoteDescription(payload.offer);
    remoteDescriptionSet = true;
    while (pendingIceCandidates.length) {
      const candidate = pendingIceCandidates.shift();
      try { await pc.addIceCandidate(candidate); } catch {}
    }
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await callChannel.send({
      type:"broadcast",
      event:"answer",
      payload:{to:payload.from,answer}
    });
  });

  callChannel.on("broadcast",{event:"answer"},async({payload})=>{
    if (payload.to!==account.id) return;
    await pc.setRemoteDescription(payload.answer);
    remoteDescriptionSet = true;
    while (pendingIceCandidates.length) {
      const candidate = pendingIceCandidates.shift();
      try { await pc.addIceCandidate(candidate); } catch {}
    }
  });

  callChannel.on("broadcast",{event:"ice"},async({payload})=>{
    if (payload.from===account.id) return;
    if (!remoteDescriptionSet) { pendingIceCandidates.push(payload.candidate); return; }
    try { await pc.addIceCandidate(payload.candidate); } catch {}
  });

  // O receptor avisa que já está dentro do canal antes do chamador enviar o offer.
  // Isso evita o problema em que a pessoa toca em “Atender”, mas volta para a tela inicial
  // porque o offer foi enviado antes de ela terminar de assinar o canal.
  let offerCreated = false;
  const createAndSendOffer = async () => {
    if (!isCaller || offerCreated || !pc || !callChannel) return;
    offerCreated = true;
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await callChannel.send({
        type:"broadcast",
        event:"offer",
        payload:{to:peerId,from:account.id,offer}
      });
    } catch (e) {
      offerCreated = false;
      toast("Não foi possível iniciar a ligação. Tente novamente.");
    }
  };

  callChannel.on("broadcast",{event:"ready"},async({payload})=>{
    if (!isCaller || !payload || payload.to!==account.id) return;
    await createAndSendOffer();
  });

  callChannel.on("broadcast",{event:"hangup"},({payload})=>{
    if (payload.from!==account.id) {
      toast("A chamada terminou.");
      endCall(false);
    }
  });

  await callChannel.subscribe();

  // Só depois de assinar o canal o receptor avisa o chamador que pode enviar o offer.
  if (!isCaller) {
    const sendReady = async () => {
      try {
        await callChannel.send({
          type:"broadcast",
          event:"ready",
          payload:{to:peerId,from:account.id}
        });
      } catch {}
    };
    await sendReady();
    // Reenvia o sinal de pronto por alguns segundos para evitar que o offer
    // seja perdido caso o outro aparelho ainda esteja terminando de assinar o canal.
    [400, 1000, 1800].forEach(ms => setTimeout(sendReady, ms));
  }

  const peerAvatar = (onlineUsers.get(normalizeUsername(peerName))?.avatar) || (findAccount(peerId)?.avatar) || makeAvatar(peerName);
  document.getElementById("app").innerHTML = `
    <div class="call-screen ${type==='video'?'video':'voice'}">
      ${type==='video'?`<video id="remoteVideo" class="remote" autoplay playsinline></video>`:`<><audio id="remoteAudio" autoplay playsinline></audio><div class="voice-center"><img class="voice-avatar" src="${peerAvatar}"><div class="voice-name">${escapeHtml(peerName)}</div><div class="call-time" id="callStatus">Conectando ligação...</div></div></>`}
      <div class="call-top"><div class="call-title"><img class="call-avatar" src="${peerAvatar}"><div><b>${escapeHtml(peerName)}</b><div style="font-size:12px;color:#cbd5e1">${type==='video'?'Chamada de vídeo':'Ligação'}</div></div></div><button class="profile-link" onclick="openCallPeerProfile('${escapeHtml(peerId)}','${escapeHtml(peerName)}')">Ver perfil</button></div>
      ${type==='video'?`<video id="localVideo" class="local" autoplay muted playsinline></video>`:''}
      <div class="controls">
        <button id="speakerBtn" class="control" onclick="toggleSpeaker()">🔊</button>
        ${type==='video'?`<button id="videoBtn" class="control videoOn" onclick="toggleCallVideo()">▣</button>`:''}
        <button id="muteBtn" class="control" onclick="toggleCallMute()">🎙️</button>
        <button class="control end" onclick="endCall(true)">☎</button>
      </div>
    </div>`;

  const lv = document.getElementById("localVideo");
  if (lv && localStream) lv.srcObject = localStream;
  const ra = document.getElementById("remoteAudio");
  if (ra) ra.volume = 1;
  openingCall = false;

  // O offer agora só é enviado depois do evento “ready” do receptor.
  // Não enviar imediatamente aqui evita que o celular receptor perca o offer.
}

function toggleCallMute(){
  if(!localStream) return;
  const track=localStream.getAudioTracks()[0]; if(!track) return;
  track.enabled=!track.enabled; const b=document.getElementById('muteBtn'); if(b){b.textContent=track.enabled?'🎙️':'🔇';b.classList.toggle('off',!track.enabled);}
}
function toggleCallVideo(){
  if(!localStream) return;
  const track=localStream.getVideoTracks()[0]; if(!track) return;
  track.enabled=!track.enabled; const b=document.getElementById('videoBtn'); if(b){b.textContent=track.enabled?'▣':'🚫';b.classList.toggle('off',!track.enabled);}
}
function toggleSpeaker(){ toast('Áudio do alto-falante alternado.'); }
function openCallPeerProfile(peerId,peerName){
  const u=onlineUsers.get(normalizeUsername(peerName));
  if(u) return viewOnlineProfile(u.username);
  if(peerId) return viewProfile(peerId);
}

async function endCall(notify=true) {
  if (notify && callChannel && account) {
    try {
      await callChannel.send({
        type:"broadcast",
        event:"hangup",
        payload:{from:account.id}
      });
    } catch {}
  }

  if (localStream) {
    localStream.getTracks().forEach(t=>t.stop());
    localStream = null;
  }

  if (pc) {
    try { pc.close(); } catch {}
    pc = null;
  }

  if (callChannel && sb) {
    try { await sb.removeChannel(callChannel); } catch {}
  }

  callChannel = null;

  if (account && document.getElementById("app") && current !== "messages" && !openingCall) {
    current = "messages";
    render();
  }
}

// Inicialização: por segurança do protótipo, SEMPRE mostra a tela de login.
// A conta continua salva no aparelho, mas nome + senha são exigidos a cada abertura.
(async function init() {
  seedCommunity();
  account = null;
  localStorage.removeItem(CURRENT_KEY);
  ensureAccountAvatars();
  auth();
})();
